[compiler.solc]
exclude_paths = ["venv", ".venv", "lib", "script", "node_modules", "test", "safe-tags-verify"]
remappings = [
    "@openzeppelin/=lib/@openzeppelin/",
    "cowprotocol/=lib/cowprotocol/src/",
    "ds-test/=lib/forge-std/lib/ds-test/src/",
    "erc4626-tests/=lib/@openzeppelin/lib/erc4626-tests/",
    "forge-std/=lib/forge-std/src/",
    "murky/=lib/murky/src/",
    "openzeppelin-contracts/=lib/murky/lib/openzeppelin-contracts/",
    "safe/=lib/safe/contracts/",
    "openzeppelin/=lib/@openzeppelin/contracts/",
]
evm_version = "cancun"
via_IR = false
target_version = "0.8.30"

[compiler.solc.optimizer]
enabled = true
runs = 20000

[detectors]
exclude = []
ignore_paths = [".venv", "test", "venv"]
exclude_paths = ["venv", ".venv", "lib", "script", "node_modules", "test"]

[testing]
cmd = "revm"

[testing.anvil]
cmd_args = "--prune-history 100 --transaction-block-keeper 10 --steps-tracing --silent"

[testing.hardhat]
cmd_args = ""
