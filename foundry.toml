[profile.default]
src = 'src'
test = 'test'
out = 'out'
libs = ['lib']

# Pinned so the compiled bytecode, and therefore every CREATE2 address, is reproducible.
solc_version = "0.8.19"
auto_detect_solc = false
evm_version = "paris"
bytecode_hash = "none"
cbor_metadata = false
optimizer = true
optimizer_runs = 20000

# Opt-in: needs z3, and every build without it warns once per compilation unit.
# Run with `FOUNDRY_PROFILE=smt forge build`.
[profile.smt.model_checker]
contracts = { 'src/types/twap/libraries/TWAPOrderMathLib.sol' = [ 'TWAPOrderMathLib' ] }
engine = 'chc'
targets = [
    'assert', 'underflow', 'overflow', 'divByZero', 'constantCondition', 'popEmptyArray', 'outOfBounds', 'balance'
]
timeout = 100000

[profile.ci]
verbosity = 3

[profile.ci.fuzz]
# pinned so a fuzz failure in CI reproduces locally; unpinned outside CI to keep exploring
seed = "672679878"
